[meta]
name = "Live Tournament Tracker"
author = "tomeki"
version = "1.2"
description = "Automatically sends your Time Attack results to Genesis Tournament. Once paired, it sends to the configured server: an Openplanet authentication token (at pairing, to verify your account ID and display name), the map UID and name, finish times with checkpoint splits and respawn count, live race progress (checkpoint count and current time), a signal when you start a new attempt and your personal best on the current map. Nothing is sent before you pair."

[script]
dependencies = ["MLFeedRaceData"]
